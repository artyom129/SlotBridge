services:
  - type: web
    name: slotbridge-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: SLOTBRIDGE_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: AVAILABILITY_SLOT_INTERVAL_MINUTES
        value: "15"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_DEMO_REGISTRATION_ENABLED
        value: "true"
      - key: PUBLIC_DEMO_ORGANIZATION_SLUG
        value: slotbridge-demo
      - key: PRODUCTION_DEMO_SEED_ENABLED
        value: "false"
      - key: ALLOW_UNSIGNED_DEMO_WEBHOOKS
        value: "false"
      - key: SLOTBRIDGE_DB_PATH
        value: /tmp/slotbridge.db
      - key: SLOTBRIDGE_DEMO_MODE
        value: "false"
