name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://slotbridge:slotbridge_test@127.0.0.1:5432/slotbridge_test
      JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      SLOTBRIDGE_ENVIRONMENT: test
      MINDBODY_WEBHOOK_SECRET: test-webhook-secret-with-at-least-32-chars
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: slotbridge_test
          POSTGRES_USER: slotbridge
          POSTGRES_PASSWORD: slotbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotbridge -d slotbridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify migrations and demo seed on PostgreSQL
        run: |
          alembic upgrade head
          alembic check
          python scripts/seed_domain.py

      - name: Run regression and booking tests
        run: python -m pytest -q --ignore=tests/test_booking_concurrency.py

      - name: Run real PostgreSQL concurrency tests
        run: python -m pytest -q tests/test_booking_concurrency.py

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        run: flutter pub get

      - name: Analyze Flutter client
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        run: flutter pub get

      - name: Analyze Flutter client
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
