name: Keep database awake

# The free Supabase database pauses after a week without queries and the free
# Render service sleeps after 15 minutes idle. The readiness check runs a real
# query, so one call a day keeps the database active and wakes the API.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the readiness check
        run: |
          url="https://slotbridge-api.onrender.com/api/v1/health/ready"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 "$url" || echo 000)
            echo "attempt $attempt: HTTP $code $(cat /tmp/body 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::The API or its database did not become ready. If Supabase paused the project, restore it in the Supabase dashboard."
          exit 1
